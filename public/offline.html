<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f7f8fa; color:#333; text-align:center; padding:24px; }
        .c { max-width:340px; }
        h1 { font-size:20px; margin:0 0 8px; }
        p { color:#888; font-size:14px; line-height:1.5; margin:0 0 20px; }
        button { padding:12px 22px; border:0; border-radius:8px; background:#007aff; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    </style>
</head>
<body>
    <div class="c">
        <h1>Sin conexión</h1>
        <p>No hay internet en este momento. Si vas en ruta, tu posición y tus entregas se enviarán en cuanto recuperes señal; mantén la app abierta.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
